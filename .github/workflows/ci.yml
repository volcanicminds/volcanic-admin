name: CI
on:
  push:
    branches: [main, develop, v5]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      # The dependencies a consumer installs. Dev-only advisories never reach a deployment;
      # a high one in production dependencies stops the build.
      - run: npm audit --omit=dev --audit-level=high
      # `build` type-checks first, then builds the library.
      - run: npm run build
      # The demo app: the mock runs from this build, so a break here is a break in the engine.
      - run: npm run build:demo
      - run: npx publint
